name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["", "address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4
      - name: Install a C++23 compiler
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_CXX_COMPILER=g++-14 -DDISKUTILITIES_BUILD_GUI=OFF
          -DDISKUTILITIES_WITH_TK4CPP=OFF -DDISKUTILITIES_SANITIZER="${{ matrix.sanitizer }}"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
